name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - name: Go test
        run: go test ./...
      - name: Build commands
        run: go build ./cmd/proxy ./cmd/agent ./cmd/relayctl

  web-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/ligolo-ng-web/package-lock.json
      - name: Install Web UI dependencies
        run: npm ci
        working-directory: web/ligolo-ng-web
      - name: Build Web UI
        run: npm run build
        working-directory: web/ligolo-ng-web

  relay-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run relay integration lab
        run: make relay-test
