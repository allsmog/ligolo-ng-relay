name: goreleaser

on:
  push:
    # run only against tags
    tags:
      - "*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      -
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      -
        name: Verify upstream ancestry
        run: |
          git remote add upstream https://github.com/nicocha30/ligolo-ng.git
          git fetch upstream master
          git merge-base --is-ancestor upstream/master HEAD
      -
        name: Go test
        run: go test ./...
      -
        name: Build commands
        run: go build ./cmd/proxy ./cmd/agent ./cmd/relayctl
      -
        name: Run relay integration lab
        run: make relay-test
      -
        name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Install cosign
        uses: sigstore/cosign-installer@v3
      -
        name: Install syft
        uses: anchore/sbom-action/download-syft@v0
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
